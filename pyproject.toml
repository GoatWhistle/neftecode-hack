[project]
name = "neftecode"
version = "0.1.0"
description = "Проверяемый советчик по качеству дизельного топлива"
requires-python = ">=3.12,<3.13"
dependencies = [
  "catboost>=1.2.8,<1.3",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
neftecode = "neftecode.bootstrap:main"
neftecode-data = "neftecode.services.data_service:main"
neftecode-model = "neftecode.services.model_service:main"
neftecode-decision = "neftecode.services.decision_service:main"
neftecode-gateway = "neftecode.services.gateway_service:main"
neftecode-stack = "neftecode.services.stack:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
